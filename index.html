<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi 3D Focus Timer</title>
  <!-- Load Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121216; color: #f4f4f6; overflow: hidden; height: 100vh; width: 100vw; }

    /* Kanvas 3D Full Screen */
    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #252432 0%, #111115 100%);
      --poster-color: transparent;
    }

    /* Panel UI Glassmorphism */
    .hud-container {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 30, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 320px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .mode-tabs { display: flex; gap: 8px; }
    .mode-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active { background: #f4f4f6; color: #121216; border-color: #f4f4f6; font-weight: 600; }

    .timer-display {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .controls { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: #e4e4e7;
      color: #121216;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #f4f4f6; }

    .audio-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: #a1a1aa;
    }
    input[type="range"] { flex: 1; accent-color: #f4f4f6; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Ganti 'ruangan.glb' dengan file 3D kamu nanti -->
  <model-viewer 
    id="viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    alt="Lo-Fi 3D Scene"
    auto-rotate 
    rotation-per-second="10deg"
    camera-controls 
    shadow-intensity="1"
    exposure="0.9">
  </model-viewer>

  <div class="hud-container">
    <div class="mode-tabs">
      <button class="mode-btn active" onclick="setMode(25, this)">Focus (25m)</button>
      <button class="mode-btn" onclick="setMode(5, this)">Break (5m)</button>
    </div>

    <div class="timer-display" id="timer">25:00</div>

    <div class="controls">
      <button class="btn" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
    </div>

    <div class="audio-bar">
      <button class="btn btn-secondary" style="padding: 6px 12px;" id="audioBtn" onclick="toggleAudio()">Play</button>
      <button class="btn btn-secondary" style="padding: 6px 12px;" onclick="playRandomTrack()" title="Acak Lagu">Shuffle</button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)" />
    </div>
    <div id="trackName" style="font-size: 11px; color: #71717a;">Track: Ready</div>
  </div>

  <audio id="bgAudio"></audio>

  <script>
    let defaultMinutes = 25;
    let timeLeft = defaultMinutes * 60;
    let timerId = null;
    let isRunning = false;

    const timerEl = document.getElementById("timer");
    const startBtn = document.getElementById("startBtn");
    const bgAudio = document.getElementById("bgAudio");
    const audioBtn = document.getElementById("audioBtn");
    const trackNameEl = document.getElementById("trackName");

    // --- TIMER LOGIC ---
    function updateDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const secs = (timeLeft % 60).toString().padStart(2, "0");
      timerEl.textContent = `${mins}:${secs}`;
      document.title = `${mins}:${secs} - Focus Timer`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerId);
        startBtn.textContent = "Start";
        isRunning = false;
      } else {
        isRunning = true;
        startBtn.textContent = "Pause";
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = "Start";
            alert("Sesi selesai!");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = "Start";
      timeLeft = defaultMinutes * 60;
      updateDisplay();
    }

    function setMode(mins, btnEl) {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
      defaultMinutes = mins;
      resetTimer();
    }

    // --- AUDIO & PLAYLIST LOGIC ---
    const playlist = [
      {
        title: "Gymnopédie No. 1 - Erik Satie (Public)",
        url: "https://upload.wikimedia.org/wikipedia/commons/3/35/Erik_Satie_-_Gymnopedie_No_1.ogg"
      },
      {
        title: "Clair de Lune - Debussy (Public)",
        url: "https://upload.wikimedia.org/wikipedia/commons/b/be/Claude_Debussy_-_Clair_de_lune.ogg"
      },
      {
        title: "My Original Guitar Loop (Upload lofi-guitar.mp3)",
        url: "lofi-guitar.mp3"
      }
    ];

    let currentTrackIndex = Math.floor(Math.random() * playlist.length);
    bgAudio.volume = 0.5;

    function loadTrack(index, autoPlay = false) {
      currentTrackIndex = index;
      const track = playlist[currentTrackIndex];
      bgAudio.src = track.url;
      trackNameEl.textContent = `Track: ${track.title}`;
      
      if (autoPlay) {
        bgAudio.play().then(() => {
          audioBtn.textContent = "Pause";
        }).catch(() => {
          trackNameEl.textContent = `File belum ada / diblokir: ${track.title}`;
          audioBtn.textContent = "Play";
        });
      }
    }

    function playRandomTrack() {
      if (playlist.length <= 1) return;
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * playlist.length);
      } while (nextIndex === currentTrackIndex);
      
      loadTrack(nextIndex, true);
    }

    bgAudio.addEventListener("ended", playRandomTrack);

    function toggleAudio() {
      if (bgAudio.paused) {
        bgAudio.play().then(() => {
          audioBtn.textContent = "Pause";
        }).catch(() => {
          playRandomTrack();
        });
      } else {
        bgAudio.pause();
        audioBtn.textContent = "Play";
      }
    }

    function changeVolume(val) {
      bgAudio.volume = val;
    }

    loadTrack(currentTrackIndex, false);
  </script>
</body>
</html>
